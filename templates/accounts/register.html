{% extends "base.html" %}

{% block title %}Register | Personal Brand OS{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Create Account</h2>
    {% if error %}
        <p style="color: #ef4444; margin-top: 0.5rem;">{{ error }}</p>
    {% endif %}
    <form method="post" style="margin-top: 1.5rem;">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" class="form-control">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Create Account</button>
    </form>
    <p style="margin-top: 1rem; color: var(--text-muted); text-align: center;">
        Already have an account? <a href="{% url 'accounts:login' %}">Login here</a>
    </p>
</div>
{% endblock %}
