{% extends "base.html" %}

{% block title %}Login | Personal Brand OS{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Login to Personal Brand OS</h2>
    <form method="post" style="margin-top: 1.5rem;">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Log In</button>
    </form>
    <p style="margin-top: 1rem; color: var(--text-muted); text-align: center;">
        Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>
    </p>
</div>
{% endblock %}
